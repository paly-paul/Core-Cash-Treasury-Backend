[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-cash-app-backend"
version = "0.1.0"
description = "Core Cash Agent App Backend - FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "alembic>=1.12",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.0",
    "motor>=3.3",
    "boto3>=1.28",
    "core-cash-shared @ file://../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]
