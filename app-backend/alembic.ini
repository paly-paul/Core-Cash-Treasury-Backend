[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic]
sqlalchemy.url = driver://user:pass@localhost/dbname
script_location = alembic
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.url_queue_strategy = threadqueue
sqlalchemy.max_identifier_length = 63

version_location_validation = all
target_metadata = app.database:Base
