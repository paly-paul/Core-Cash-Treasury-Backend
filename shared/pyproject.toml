[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-cash-shared"
version = "0.1.0"
description = "Shared schemas, enums, and utilities for Core Cash Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
