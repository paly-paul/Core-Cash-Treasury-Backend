[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-cash-ai-backend"
version = "0.1.0"
description = "Core Cash Agent AI Backend - LangGraph orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "motor>=3.3",
    "langgraph>=0.0.1",
    "langchain-core>=0.1",
    "pydantic-settings>=2.0",
    "anthropic>=0.7",
    "core-cash-shared @ file://../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
